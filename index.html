<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <style>
    :root {
      --bg: #0a0a0f; --neon: #00ff41; --cyan: #00d4ff; --gold: #ffd93d; --warn: #ff6b6b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: #e0e0e0;
      font-family: 'Courier New', 'Consolas', monospace;
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh;
    }
    .hub {
      text-align: center; max-width: 780px; width: 92%;
      padding: 24px 0 60px;
    }

    /* ── Auth bar ── */
    #auth-bar {
      display: flex; justify-content: flex-end; align-items: center;
      gap: 12px; padding: 8px 0; margin-bottom: 8px;
      font-size: 13px; color: #666;
    }
    #auth-bar .auth-btn {
      background: transparent; border: 1px solid #333; color: #888;
      font-family: inherit; font-size: 12px; padding: 4px 14px;
      cursor: pointer; transition: all 0.2s;
    }
    #auth-bar .auth-btn:hover { border-color: var(--neon); color: var(--neon); }
    #auth-bar .auth-btn.primary { border-color: var(--neon); color: var(--neon); }
    #auth-bar .auth-user { color: var(--neon); }
    #user-rank { color: var(--gold); margin-left: 6px; }

    /* ── Title ── */
    .hub-title {
      font-size: 36px; color: var(--neon);
      text-shadow: 0 0 20px rgba(0,255,65,0.4); letter-spacing: 4px; margin-bottom: 6px;
    }
    .hub-subtitle { font-size: 14px; color: #555; margin-bottom: 36px; letter-spacing: 2px; }

    /* ── Game cards ── */
    .game-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 36px; }
    .game-card {
      display: flex; align-items: center; gap: 20px;
      padding: 22px 28px; background: rgba(0,255,65,0.03);
      border: 1px solid #1a3a1a; text-decoration: none; color: inherit;
      transition: all 0.25s ease; text-align: left; cursor: pointer;
    }
    .game-card:hover {
      border-color: var(--neon); background: rgba(0,255,65,0.06);
      box-shadow: 0 0 24px rgba(0,255,65,0.12); transform: translateX(4px);
    }
    .game-card:nth-child(2) { background: rgba(0,212,255,0.03); border-color: #1a2e3a; }
    .game-card:nth-child(2):hover {
      border-color: var(--cyan); background: rgba(0,212,255,0.06);
      box-shadow: 0 0 24px rgba(0,212,255,0.12);
    }
    .game-icon { font-size: 40px; flex-shrink: 0; width: 56px; text-align: center; }
    .game-info { flex: 1; }
    .game-name { font-size: 20px; font-weight: bold; letter-spacing: 2px; margin-bottom: 4px; }
    .game-card:nth-child(1) .game-name { color: var(--neon); }
    .game-card:nth-child(2) .game-name { color: var(--cyan); }
    .game-desc { font-size: 13px; color: #888; line-height: 1.5; }
    .game-arrow { font-size: 20px; color: #444; flex-shrink: 0; transition: all 0.25s ease; }
    .game-card:hover .game-arrow { color: var(--neon); transform: translateX(4px); }
    .game-card:nth-child(2):hover .game-arrow { color: var(--cyan); }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.82); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #0d0d0d; border: 1px solid var(--cyan); padding: 28px 32px;
      max-width: 380px; width: 90%; box-shadow: 0 0 20px rgba(0,212,255,0.15);
    }
    .modal h3 { font-size: 18px; color: var(--cyan); margin-bottom: 20px; letter-spacing: 2px; }
    .modal input {
      display: block; width: 100%; margin-bottom: 12px; padding: 10px 12px;
      background: #111; border: 1px solid #333; color: #e0e0e0;
      font-family: inherit; font-size: 14px; outline: none;
    }
    .modal input:focus { border-color: var(--cyan); }
    .modal .modal-btn {
      display: block; width: 100%; padding: 10px; font-family: inherit; font-size: 14px;
      border: 1px solid var(--cyan); color: var(--cyan); background: transparent;
      cursor: pointer; transition: all 0.2s; margin-top: 8px;
    }
    .modal .modal-btn:hover { background: rgba(0,212,255,0.1); }
    .modal .modal-err { color: var(--warn); font-size: 12px; margin-top: 8px; min-height: 16px; }
    .modal .modal-toggle { font-size: 12px; color: #666; margin-top: 12px; text-align: center; cursor: pointer; }
    .modal .modal-toggle span { color: var(--cyan); }
    .modal .modal-close {
      float: right; background: none; border: none; color: var(--warn); font-size: 18px;
      cursor: pointer; font-family: inherit;
    }

    /* ── Leaderboard ── */
    .lb-section { margin-top: 10px; }
    .lb-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .lb-tab {
      background: transparent; border: 1px solid #333; color: #666;
      font-family: inherit; font-size: 12px; padding: 6px 16px; cursor: pointer; transition: all 0.2s;
    }
    .lb-tab.active { border-color: var(--neon); color: var(--neon); }
    .lb-tab:hover:not(.active) { border-color: #555; color: #aaa; }
    .lb-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    .lb-table th {
      color: #555; font-weight: normal; text-transform: uppercase;
      letter-spacing: 1px; padding: 8px 12px; border-bottom: 1px solid #1a1a1a;
      font-size: 11px;
    }
    .lb-table td {
      padding: 7px 12px; border-bottom: 1px solid #0f0f0f;
    }
    .lb-table .rank { color: var(--gold); width: 40px; }
    .lb-table .username { text-align: left; }
    .lb-table .score { color: var(--neon); }
    .lb-table .time { color: #888; font-size: 12px; }
    .lb-table .tags { color: #555; font-size: 10px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-empty { color: #444; padding: 24px; font-size: 13px; }

    /* ── Footer ── */
    #watermark {
      position: fixed; bottom: 12px; right: 16px;
      font-family: 'Courier New', 'Consolas', monospace;
      font-size: 13px; color: rgba(224,224,224,0.35);
      letter-spacing: 2px; pointer-events: none; z-index: 500;
    }

    @media (max-width: 600px) {
      .hub-title { font-size: 24px; }
      .game-card { padding: 16px 18px; }
      .game-icon { font-size: 30px; width: 40px; }
      .game-name { font-size: 16px; }
      .lb-table { font-size: 11px; }
      .lb-table th, .lb-table td { padding: 5px 6px; }
    }
  </style>
</head>
<body>
  <div class="hub">
    <!-- ── Auth Bar ── -->
    <div id="auth-bar">
      <span id="auth-status">未登录</span>
      <button class="auth-btn" id="btn-login" onclick="showModal('login')">登录</button>
      <button class="auth-btn primary" id="btn-register" onclick="showModal('register')">注册</button>
      <button class="auth-btn" id="btn-logout" style="display:none" onclick="doLogout()">退出</button>
    </div>

    <h1 class="hub-title">GAME HUB</h1>
    <p class="hub-subtitle">选择一个游戏开始</p>

    <div class="game-list">
      <a href="campus-defender.html" class="game-card">
        <div class="game-icon">🛡️</div>
        <div class="game-info">
          <div class="game-name">Campus Defender</div>
          <div class="game-desc">化身Cassel学院安全研究员，在终端里敲下命令，完成从侦察到渗透的完整攻击链</div>
        </div>
        <div class="game-arrow">▶</div>
      </a>
      <a href="cyber-guardian.html" class="game-card">
        <div class="game-icon">🔍</div>
        <div class="game-info">
          <div class="game-name">Cyber Guardian</div>
          <div class="game-desc">像素风的赛博空间里，每一条线索都指向一个秘密，等你来解开</div>
        </div>
        <div class="game-arrow">▶</div>
      </a>
    </div>

    <!-- ── Leaderboard ── -->
    <div class="lb-section">
      <div class="lb-tabs">
        <button class="lb-tab active" onclick="switchLB('campus-defender', this)">Campus Defender</button>
        <button class="lb-tab" onclick="switchLB('cyber-guardian', this)">Cyber Guardian</button>
        <button class="lb-tab" onclick="switchLB('total', this)">总榜</button>
      </div>
      <div id="lb-content"><div class="lb-empty">加载中...</div></div>
    </div>
  </div>

  <!-- ── Auth Modal ── -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <button class="modal-close" onclick="hideModal()">✕</button>
      <h3 id="modal-title">登录</h3>
      <input type="text" id="modal-username" placeholder="用户名" maxlength="30">
      <input type="password" id="modal-password" placeholder="密码" maxlength="100">
      <button class="modal-btn" id="modal-submit" onclick="doAuth()">登录</button>
      <div class="modal-err" id="modal-err"></div>
      <div class="modal-toggle" id="modal-toggle" onclick="toggleAuthMode()">
        没有账号？<span>立即注册</span>
      </div>
    </div>
  </div>

  <div id="watermark">武汉大学国家网络安全学院</div>

  <script src="js/api.js"></script>
  <script>
    var authMode = 'login';

    function $(id) { return document.getElementById(id); }

    // ── Auth UI ──
    function updateAuthUI() {
      var user = API.getUser();
      if (user) {
        $('auth-status').innerHTML = '👤 <span class="auth-user">' + user.username + '</span>';
        $('btn-login').style.display = 'none';
        $('btn-register').style.display = 'none';
        $('btn-logout').style.display = '';
        // Fetch rank
        API.getLeaderboard('total').then(function(lb) {
          var entries = lb.leaderboard || [];
          for (var i = 0; i < entries.length; i++) {
            if (entries[i].username === user.username) {
              var r = entries[i].rank;
              var tag = entries[i].bypassCount ? ' [' + entries[i].bypassCount + '漏洞]' : '';
              $('auth-status').innerHTML = '👤 <span class="auth-user">' + user.username + '</span><span id="user-rank">#' + r + tag + '</span>';
              break;
            }
          }
        }).catch(function(){});
      } else {
        $('auth-status').textContent = '未登录';
        $('btn-login').style.display = '';
        $('btn-register').style.display = '';
        $('btn-logout').style.display = 'none';
      }
    }

    function showModal(mode) {
      authMode = mode;
      $('modal-title').textContent = mode === 'login' ? '登录' : '注册';
      $('modal-submit').textContent = mode === 'login' ? '登录' : '注册';
      $('modal-err').textContent = '';
      $('modal-username').value = '';
      $('modal-password').value = '';
      if (mode === 'login') {
        $('modal-toggle').innerHTML = '没有账号？<span>立即注册</span>';
      } else {
        $('modal-toggle').innerHTML = '已有账号？<span>立即登录</span>';
      }
      $('auth-modal').classList.add('show');
      $('modal-username').focus();
    }

    function hideModal() {
      $('auth-modal').classList.remove('show');
    }

    function toggleAuthMode() {
      showModal(authMode === 'login' ? 'register' : 'login');
    }

    async function doAuth() {
      var username = $('modal-username').value.trim();
      var password = $('modal-password').value;
      $('modal-err').textContent = '';
      if (!username || !password) { $('modal-err').textContent = '请填写用户名和密码'; return; }
      try {
        if (authMode === 'login') {
          await API.login(username, password);
        } else {
          await API.register(username, password);
        }
        hideModal();
        updateAuthUI();
        refreshCurrentLB();
      } catch (e) {
        $('modal-err').textContent = e.message;
      }
    }

    function doLogout() {
      API.logout();
      updateAuthUI();
      refreshCurrentLB();
    }

    // Enter key in modal
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && $('auth-modal').classList.contains('show')) {
        doAuth();
      }
    });

    // ── Leaderboard ──
    var currentLB = 'campus-defender';

    function switchLB(game, btn) {
      currentLB = game;
      document.querySelectorAll('.lb-tab').forEach(function(t) { t.classList.remove('active'); });
      if (btn) btn.classList.add('active');
      refreshCurrentLB();
    }

    function refreshCurrentLB() {
      $('lb-content').innerHTML = '<div class="lb-empty">加载中...</div>';
      API.getLeaderboard(currentLB).then(function(data) {
        renderLB(data);
      }).catch(function() {
        $('lb-content').innerHTML = '<div class="lb-empty">排行榜暂时不可用</div>';
      });
    }

    function renderLB(data) {
      var entries = data.leaderboard || [];
      if (entries.length === 0) {
        $('lb-content').innerHTML = '<div class="lb-empty">暂无数据，成为第一个上榜的人！</div>';
        return;
      }
      var html = '<table class="lb-table"><thead><tr><th></th><th>玩家</th><th>分数</th><th>用时</th><th>漏洞类型</th></tr></thead><tbody>';
      for (var i = 0; i < Math.min(entries.length, 50); i++) {
        var e = entries[i];
        var rankIcon = e.rank === 1 ? '🥇' : e.rank === 2 ? '🥈' : e.rank === 3 ? '🥉' : e.rank;
        var timeStr = e.time_seconds != null ? (e.time_seconds <= -1 ? '-1s' : e.time_seconds + 's') : '—';
        var tags = '';
        if (e.bypasses && e.bypasses.length > 0) {
          tags = e.bypasses.length + '项: ' + e.bypasses.slice(0,5).join(' ');
          if (e.bypasses.length > 5) tags += ' ...';
        }
        var isMe = API.getUser() && API.getUser().username === e.username;
        var rowStyle = isMe ? 'background:rgba(0,255,65,0.05);font-weight:bold' : '';
        html += '<tr style="' + rowStyle + '"><td class="rank">' + rankIcon + '</td><td class="username">' + esc(e.username) + '</td><td class="score">' + e.score + '</td><td class="time">' + timeStr + '</td><td class="tags" title="' + esc(tags) + '">' + esc(tags) + '</td></tr>';
      }
      html += '</tbody></table>';
      $('lb-content').innerHTML = html;
    }

    function esc(s) {
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(s));
      return d.innerHTML;
    }

    // ── Init ──
    updateAuthUI();
    refreshCurrentLB();
  </script>
</body>
</html>
