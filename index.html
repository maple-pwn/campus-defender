<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --neon: #00ff41;
      --cyan: #00d4ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: #e0e0e0;
      font-family: 'Courier New', 'Consolas', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hub {
      text-align: center;
      max-width: 700px;
      width: 90%;
    }
    .hub-title {
      font-size: 36px;
      color: var(--neon);
      text-shadow: 0 0 20px rgba(0,255,65,0.4);
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    .hub-subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 48px;
      letter-spacing: 2px;
    }
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .game-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 28px 32px;
      background: rgba(0,255,65,0.03);
      border: 1px solid #1a3a1a;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      text-align: left;
      cursor: pointer;
    }
    .game-card:hover {
      border-color: var(--neon);
      background: rgba(0,255,65,0.06);
      box-shadow: 0 0 24px rgba(0,255,65,0.12);
      transform: translateX(4px);
    }
    .game-card:nth-child(2) {
      background: rgba(0,212,255,0.03);
      border-color: #1a2e3a;
    }
    .game-card:nth-child(2):hover {
      border-color: var(--cyan);
      background: rgba(0,212,255,0.06);
      box-shadow: 0 0 24px rgba(0,212,255,0.12);
    }
    .game-icon {
      font-size: 40px;
      flex-shrink: 0;
      width: 56px;
      text-align: center;
    }
    .game-info {
      flex: 1;
    }
    .game-name {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .game-card:nth-child(1) .game-name { color: var(--neon); }
    .game-card:nth-child(2) .game-name { color: var(--cyan); }
    .game-desc {
      font-size: 13px;
      color: #888;
      line-height: 1.5;
    }
    .game-arrow {
      font-size: 20px;
      color: #444;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }
    .game-card:hover .game-arrow {
      color: var(--neon);
      transform: translateX(4px);
    }
    .game-card:nth-child(2):hover .game-arrow {
      color: var(--cyan);
    }
    .footer {
      margin-top: 48px;
      font-size: 12px;
      color: #444;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="hub">
    <h1 class="hub-title">GAME HUB</h1>
    <p class="hub-subtitle">选择一个游戏开始</p>

    <div class="game-list">
      <a href="campus-defender.html" class="game-card">
        <div class="game-icon">🛡️</div>
        <div class="game-info">
          <div class="game-name">Campus Defender</div>
          <div class="game-desc">网络安全训练模拟器 · 5章10关 · 命令行终端风格</div>
        </div>
        <div class="game-arrow">▶</div>
      </a>

      <a href="cyber-guardian.html" class="game-card">
        <div class="game-icon">🔍</div>
        <div class="game-info">
          <div class="game-name">Cyber Guardian</div>
          <div class="game-desc">白帽侦查员 · 像素风 · 渗透测试模拟</div>
        </div>
        <div class="game-arrow">▶</div>
      </a>
    </div>

    <p class="footer">国家网络安全学院</p>
  </div>
</body>
</html>
