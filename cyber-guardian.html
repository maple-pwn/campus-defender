<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Guardian — 白帽侦查员</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ========== GLOBAL ========== */
:root {
  --bg: #0a0a0f; --bg2: #12121f; --panel: #1a1a2e;
  --neon: #00ff41; --warn: #ff6b6b; --gold: #ffd93d;
  --cyan: #00d4ff; --white: #e0e0e0; --dim: #777;
  --font-pixel: 'Zpix', 'zpix', 'Fusion Pixel 12px Monospaced SC',
    'Ark Pixel 12px Monospaced zh_cn', '新宋体', 'SimSun', monospace;
  --font-terminal: var(--font-pixel);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000; color:var(--white); font-family:var(--font-pixel);
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; overflow:hidden; user-select:none;
  -webkit-font-smoothing:none; -moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;
}
#game {
  width:1000px; height:700px; background:var(--bg);
  border:4px solid #333; position:relative; overflow:hidden;
  box-shadow: 0 0 40px rgba(0,255,65,0.1), 0 0 80px rgba(0,0,0,0.8);
  image-rendering:pixelated;
}
.footer-mark {
  position:absolute; left:14px; bottom:10px; z-index:29; pointer-events:none;
  font-size:12px; line-height:1.7; color:rgba(224,224,224,0.52);
  text-shadow:0 0 8px rgba(0,0,0,0.9);
}
.footer-mark .org { color:rgba(0,212,255,0.68); }
.footer-mark .purpose { color:rgba(0,255,65,0.55); }
/* CRT overlay */
#crt {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:1;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 2px, transparent 2px, transparent 4px);
  opacity:0.5;
}

/* ========== SCREENS ========== */
.screen { position:absolute; top:0; left:0; width:100%; height:100%; display:none; flex-direction:column; }

/* ========== START SCREEN ========== */
#start-screen {
  justify-content:center; align-items:center;
  background: linear-gradient(180deg, #0a0a1a 0%, #0d1b2a 50%, #0a0a1a 100%);
}
#start-screen .title {
  font-size:42px; color:var(--neon); text-shadow:0 0 20px var(--neon);
  text-align:center; line-height:1.6; animation: flicker 3s infinite;
}
@keyframes flicker {
  0%,100% { opacity:1; } 92% { opacity:1; } 93% { opacity:0.6; } 94% { opacity:1; } 96% { opacity:0.5; } 97% { opacity:1; }
}
#start-screen .subtitle { font-size:16px; color:var(--cyan); margin-top:12px; text-align:center; }
#start-screen .start-btn {
  margin-top:40px; padding:18px 60px; font-size:18px; font-family:var(--font-pixel);
  background:transparent; color:var(--neon); border:3px solid var(--neon);
  cursor:pointer; transition:all 0.15s; letter-spacing:2px;
  box-shadow: 0 0 10px rgba(0,255,65,0.3);
}
#start-screen .start-btn:hover { background:var(--neon); color:#000; box-shadow:0 0 30px var(--neon); }
#start-screen .level-sel { margin-top:30px; display:flex; gap:16px; }
#start-screen .level-sel button {
  padding:12px 24px; font-size:13px; font-family:var(--font-pixel);
  background:transparent; color:var(--dim); border:2px solid var(--dim); cursor:pointer;
}
#start-screen .level-sel button.unlocked { color:var(--cyan); border-color:var(--cyan); }
#start-screen .level-sel button.unlocked:hover { background:var(--cyan); color:#000; }

/* ========== TOP BAR ========== */

#top-bar .back-link {
  color: var(--dim);
  text-decoration: none;
  font-size: 13px;
  margin-right: 10px;
  transition: color 0.2s;
}
#top-bar .back-link:hover {
  color: var(--neon);
  text-shadow: 0 0 6px var(--neon);
}

#top-bar {
  height:52px; background:var(--bg2); border-bottom:2px solid #333;
  display:flex; align-items:center; padding:0 16px; gap:16px; flex-shrink:0;
}
#top-bar .level-name { font-size:14px; color:var(--cyan); }
#top-bar .score { font-size:14px; color:var(--gold); margin-left:auto; }
#top-bar .hint-btn {
  font-size:14px; font-family:var(--font-pixel); background:transparent;
  color:var(--gold); border:2px solid var(--gold); cursor:pointer;
  padding:6px 12px; transition:all 0.15s;
}
#top-bar .hint-btn:hover { background:var(--gold); color:#000; }
#top-bar .clue-btn {
  font-size:13px; font-family:var(--font-pixel); background:transparent;
  color:var(--cyan); border:2px solid var(--cyan); cursor:pointer;
  padding:6px 12px;
}
#top-bar .clue-btn:hover { background:var(--cyan); color:#000; }

/* ========== SCENE AREA ========== */
#scene { flex:1; position:relative; overflow:hidden; cursor:default; }
.room { position:absolute; top:0; left:0; width:100%; height:100%; display:none; }
.room.active { display:block; }

/* Room backgrounds */
.room-bedroom {
  background: linear-gradient(180deg, #1a0a0a 0%, #1a1218 40%, #1a1418 60%, #2a1a1a 100%);
}
.room-office {
  background: linear-gradient(180deg, #0a1a1a 0%, #101820 40%, #101820 60%, #1a1a2a 100%);
}
.room-server {
  background: linear-gradient(180deg, #050510 0%, #0a0a1a 30%, #0a0a1a 70%, #0a1015 100%);
}

/* Hotspot items */
.hotspot {
  position:absolute; cursor:pointer; transition: all 0.2s;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:10px; border:3px solid transparent; overflow:visible;
}
.hotspot:hover {
  border-color:var(--gold); background:rgba(255,217,61,0.08);
  filter: brightness(1.3);
  animation: pulse 0.8s infinite;
}
.hotspot:active { transform:scale(0.92); }
.hotspot .icon { font-size:40px; text-align:center; image-rendering:pixelated; line-height:1; }
.hotspot .label {
  font-size:12px; color:var(--dim); text-align:center; white-space:nowrap;
  opacity:0; transition:opacity 0.2s;
}
.hotspot:hover .label { opacity:1; color:var(--gold); }
.hotspot.collected { filter:brightness(0.6); border-color:var(--dim); background:rgba(0,255,65,0.05); }
.hotspot.collected .label { opacity:1; color:var(--neon); }

@keyframes pulse {
  0%,100% { transform:scale(1); } 50% { transform:scale(1.05); }
}
@keyframes glow {
  0%,100% { box-shadow: 0 0 10px rgba(0,255,65,0.6), 0 0 25px rgba(0,255,65,0.2); }
  50% { box-shadow: 0 0 20px rgba(0,255,65,0.9), 0 0 50px rgba(0,255,65,0.5), 0 0 80px rgba(0,255,65,0.2); }
}
.hotspot.action-item {
  border-color: var(--neon) !important;
  border-width: 3px !important;
  animation: glow 1.5s infinite;
}
.hotspot.action-item:hover {
  animation: glow 0.4s infinite, pulse 0.6s infinite;
  border-color: #fff !important;
}
.hotspot.action-item .label {
  opacity: 1 !important; color: var(--neon) !important;
  font-weight: bold;
}

/* ========== POPUPS ========== */
.popup-overlay {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.7); display:none; justify-content:center;
  align-items:center; z-index:10;
}
.popup-overlay.show { display:flex; }
.popup {
  background:var(--panel); border:3px solid var(--cyan);
  padding:20px; max-width:520px; width:90%; max-height:80%;
  overflow-y:auto; position:relative;
  box-shadow: 0 0 20px rgba(0,212,255,0.2), 8px 8px 0 #000;
}
.popup .close-btn {
  position:absolute; top:8px; right:12px;
  font-family:var(--font-pixel); font-size:18px; color:var(--warn);
  background:none; border:none; cursor:pointer;
}
.popup .close-btn:hover { color:#fff; }
.popup h3 { font-size:19px; color:var(--neon); margin-bottom:14px; }
.popup p { font-size:17px; line-height:1.9; color:var(--white); }

/* ========== COMPUTER / TERMINAL PANELS ========== */
.panel-overlay {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.85); display:none; justify-content:center;
  align-items:center; z-index:20;
}
.panel-overlay.show { display:flex; }

/* Computer login screen */
#login-panel {
  background:var(--bg); border:3px solid #444; width:540px;
  box-shadow: 0 0 30px rgba(0,255,65,0.15), 8px 8px 0 #000;
}
#login-panel .screen-header {
  background:#111; padding:10px 16px; font-size:14px; color:var(--dim);
  border-bottom:1px solid #333; display:flex; justify-content:space-between;
}
#login-panel .screen-body { padding:32px; }
#login-panel .login-label { font-size:17px; color:var(--neon); margin-bottom:12px; }
#login-panel .login-hint { font-size:15px; color:var(--gold); margin-bottom:20px; }
#login-panel .password-input {
  width:100%; padding:14px 16px; font-size:20px; font-family:var(--font-terminal);
  background:#050508; color:var(--neon); border:3px solid var(--neon);
  outline:none; letter-spacing:3px;
  box-shadow: 0 0 12px rgba(0,255,65,0.2);
}
#login-panel .password-input:focus {
  border-color:#fff; box-shadow: 0 0 20px rgba(0,255,65,0.4);
}
#login-panel .password-input::placeholder { color:#444; font-size:14px; letter-spacing:1px; }
#login-panel .strength-bar {
  height:12px; margin-top:12px; background:#222; border-radius:0;
  overflow:hidden; border:1px solid #333;
}
#login-panel .strength-fill { height:100%; width:0%; transition:width 0.3s; }
#login-panel .login-btn {
  margin-top:20px; padding:12px 32px; font-size:14px; font-family:var(--font-pixel);
  background:transparent; color:var(--neon); border:3px solid var(--neon); cursor:pointer;
}
#login-panel .login-btn:hover { background:var(--neon); color:#000; }
#login-panel .login-feedback { font-size:15px; line-height:1.8; margin-top:12px; min-height:22px; }

/* Terminal panel */
#terminal-panel {
  background:var(--bg); border:3px solid #444; width:720px;
  box-shadow: 0 0 30px rgba(0,255,65,0.15), 8px 8px 0 #000;
}
#terminal-panel .term-header {
  background:#111; padding:8px 14px; font-size:13px; color:var(--dim);
  border-bottom:1px solid #333;
}
#terminal-panel .term-body {
  padding:16px; min-height:240px; max-height:380px; overflow-y:auto;
  font-size:17px; font-family:var(--font-terminal); line-height:1.85;
  color:var(--neon); background:#050508;
}
#terminal-panel .term-input-line { display:flex; align-items:center; }
#terminal-panel .term-prompt { color:var(--cyan); margin-right:8px; white-space:nowrap; }
#terminal-panel .term-input {
  flex:1; background:transparent; border:none; color:var(--neon);
  font-family:var(--font-terminal); font-size:17px; outline:none; caret-color:var(--neon);
}
#terminal-panel .term-hint {
  margin-top:10px; font-size:15px; color:var(--dim); border-top:1px solid #222; padding-top:10px;
}

/* Email panel */
#email-panel {
  background:var(--bg); border:3px solid #444; width:640px; max-height:620px;
  box-shadow: 0 0 30px rgba(0,255,65,0.15), 8px 8px 0 #000;
}
#email-panel .email-header-bar {
  background:#111; padding:10px 16px; font-size:14px; color:var(--dim);
  border-bottom:1px solid #333;
}
#email-panel .email-body { padding:16px; max-height:560px; overflow-y:auto; }
#email-panel .email-field { margin-bottom:10px; }
#email-panel .email-field .field-label { font-size:14px; color:var(--dim); }
#email-panel .email-field .field-value { font-size:16px; color:var(--white); margin-top:2px; }
#email-panel .email-field.can-inspect { cursor:pointer; padding:6px; border:1px solid transparent; }
#email-panel .email-field.can-inspect:hover { border-color:var(--gold); background:rgba(255,217,61,0.1); }
#email-panel .email-field.can-inspect:hover::after { content:' [点此检查]'; font-size:11px; color:var(--gold); }
#email-panel .email-raw-btn { margin-top:14px; font-size:14px; font-family:var(--font-pixel);
  background:transparent; color:var(--dim); border:1px solid var(--dim); cursor:pointer; padding:8px 12px; }
#email-panel .email-raw-btn:hover { color:var(--cyan); border-color:var(--cyan); }
#email-panel .email-raw { display:none; margin-top:10px; padding:10px; background:#050508;
  font-family:var(--font-terminal); font-size:14px; color:var(--neon); line-height:1.7; }
#email-panel .email-raw.show { display:block; }
#email-panel .case-brief {
  font-size:14px; color:var(--gold); line-height:1.75; margin-bottom:12px;
  padding:10px; border-left:2px solid var(--gold); background:rgba(255,217,61,0.06);
}
#email-panel .trace-terminal {
  margin-top:12px; padding:12px; background:#050508; border:1px solid #333;
}
#email-panel .trace-title { font-size:14px; color:var(--cyan); margin-bottom:8px; }
#email-panel .trace-note { font-size:13px; color:var(--dim); line-height:1.65; margin-bottom:8px; }
#email-panel .trace-line { display:flex; gap:8px; align-items:center; }
#email-panel .trace-line input {
  flex:1; min-width:0; padding:8px; font-size:14px; font-family:var(--font-terminal);
  background:#000; color:var(--neon); border:1px solid #333; outline:none;
}
#email-panel .trace-line input:focus { border-color:var(--neon); }
#email-panel .trace-line button {
  flex:0 0 auto; padding:8px 12px; font-size:12px; font-family:var(--font-pixel);
  background:transparent; color:var(--cyan); border:1px solid var(--cyan); cursor:pointer;
}
#email-panel .trace-line button:hover { background:var(--cyan); color:#000; }
#email-panel .trace-line button:disabled { color:#555; border-color:#333; cursor:not-allowed; }
#email-panel .trace-line button:disabled:hover { background:transparent; color:#555; }
#email-panel #whois-result { margin-top:8px; font-size:13px; color:var(--white); line-height:1.7; }

/* ========== CLUE NOTEBOOK ========== */
#notebook {
  position:absolute; right:0; top:52px; width:320px; height:calc(100% - 52px);
  background:var(--panel); border-left:3px solid #333; z-index:15;
  transform:translateX(100%); transition:transform 0.3s;
  padding:18px; overflow-y:auto;
}
#notebook.open { transform:translateX(0); }
#notebook h3 { font-size:16px; color:var(--gold); }
#notebook .clue-item {
  font-size:15px; color:var(--white); padding:10px; margin-bottom:8px;
  background:rgba(255,255,255,0.03); border-left:2px solid var(--cyan);
  line-height:1.8;
}

/* ========== LEVEL COMPLETE ========== */
#level-complete {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.9); display:none; flex-direction:column;
  justify-content:center; align-items:center; z-index:30;
}
#level-complete.show { display:flex; }
#level-complete h2 { font-size:30px; color:var(--neon); text-shadow:0 0 20px var(--neon); }
#level-complete .stars { font-size:48px; margin:16px 0; }
#level-complete .score-text { font-size:17px; color:var(--gold); margin-bottom:10px; }
#level-complete .knowledge-card {
  margin-top:18px; padding:20px; background:var(--panel); border:2px solid var(--cyan);
  max-width:620px; width:90%;
}
#level-complete .knowledge-card h4 { font-size:16px; color:var(--cyan); margin-bottom:10px; }
#level-complete .knowledge-card ul { list-style:none; }
#level-complete .knowledge-card li { font-size:16px; color:var(--white); line-height:2.1; padding-left:20px; position:relative; }
#level-complete .knowledge-card li::before { content:'▸'; position:absolute; left:0; color:var(--neon); }
#level-complete .next-btn {
  margin-top:24px; padding:14px 40px; font-size:15px; font-family:var(--font-pixel);
  background:transparent; color:var(--neon); border:2px solid var(--neon); cursor:pointer;
}
#level-complete .next-btn:hover { background:var(--neon); color:#000; }

/* ========== GAME COMPLETE ========== */
#game-complete {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.95); display:none; flex-direction:column;
  justify-content:center; align-items:center; z-index:30;
}
#game-complete.show { display:flex; }
#game-complete h2 { font-size:32px; color:var(--gold); text-shadow:0 0 30px var(--gold); }
#game-complete .rank { font-size:21px; color:var(--neon); margin:14px 0; }
#game-complete .final-score { font-size:17px; color:var(--white); margin:10px 0; }
#game-complete .restart-btn {
  margin-top:28px; padding:14px 40px; font-size:15px; font-family:var(--font-pixel);
  background:transparent; color:var(--gold); border:2px solid var(--gold); cursor:pointer;
}
#game-complete .restart-btn:hover { background:var(--gold); color:#000; }

/* ========== PARTICLES CANVAS ========== */
#particles {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:28; display:none;
}

/* ========== RESPONSIVE ========== */
@media (max-width:1020px) {
  #game { width:100vw; height:100vw; max-height:100vh; }
  #notebook { width:220px; }
}
</style>
</head>
<body>
<div id="game">

  <div id="crt"></div>
  <div class="footer-mark">
    <div class="org">武汉大学国家网络安全学院</div>
  </div>

  <!-- ===== START SCREEN ===== -->
  <div id="start-screen" class="screen" style="display:flex;justify-content:center;align-items:center;">
    <div class="title">⚔️ 白帽侦查员<br>CYBER GUARDIAN</div>
    <div class="subtitle">像素解谜 · 网络安全 · 三关挑战</div>
    <button class="start-btn" onclick="startGame()">▶ 开始任务</button>
    <div class="level-sel" id="level-select"></div>
  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div id="game-screen" class="screen">
    <div id="top-bar">
      <a href="index.html" class="back-link">← 首页</a>
      <span class="level-name" id="bar-level">任务一</span>
      <span class="score" id="bar-score">🔒 安全指数: 100</span>
      <button class="clue-btn" onclick="toggleNotebook()">📒 线索本</button>
      <button class="hint-btn" onclick="showGuideHint()">❓ 引导</button>
    </div>
    <div id="scene">
      <!-- Room content injected by JS -->
    </div>
    <div id="notebook">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;">📒 线索记录</h3>
        <button onclick="toggleNotebook()" style="background:none;border:none;color:var(--warn);font-family:var(--font-pixel);font-size:16px;cursor:pointer;padding:0 4px;">✕</button>
      </div>
      <div id="clue-list"></div>
    </div>
  </div>

  <!-- ===== DETAIL POPUP ===== -->
  <div class="popup-overlay" id="detail-overlay">
    <div class="popup" id="detail-popup">
      <button class="close-btn" onclick="closeDetail()">✕</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <!-- ===== LOGIN PANEL ===== -->
  <div class="panel-overlay" id="login-overlay">
    <div id="login-panel">
      <div class="screen-header"><span>💻 系统登录</span><span>Locked</span></div>
      <div class="screen-body">
        <button class="close-btn" onclick="var o=document.getElementById('login-overlay');o.classList.remove('show');o.style.display='none'" style="top:8px;right:12px;font-size:16px;">✕</button>
      <div class="login-label" onclick="document.getElementById('password-input').focus()">🔐 请输入密码：</div>
        <div class="login-hint" id="login-clue-display" onclick="document.getElementById('password-input').focus()"></div>
        <input class="password-input" id="password-input" type="text" placeholder="点击这里输入密码..."
               oninput="updateStrength()" onkeydown="if(event.key==='Enter')tryLogin()" autocomplete="off" autofocus>
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div style="font-size:13px;color:var(--dim);margin-top:6px;" id="strength-text"></div>
        <button class="login-btn" onclick="tryLogin()">↵ 登 录</button>
        <div class="login-feedback" id="login-feedback"></div>
      </div>
    </div>
  </div>

  <!-- ===== EMAIL PANEL ===== -->
  <div class="panel-overlay" id="email-overlay">
    <div id="email-panel">
      <div class="email-header-bar">📧 邮件客户端 — 已登入</div>
      <div class="email-body" id="email-body"></div>
    </div>
  </div>

  <!-- ===== TERMINAL PANEL ===== -->
  <div class="panel-overlay" id="terminal-overlay">
    <div id="terminal-panel">
      <div class="term-header">🖥️ 服务器终端 — server-admin@firewall:~$</div>
      <div class="term-body" id="term-output"></div>
      <div class="term-hint" id="term-hint-area">💡 输入 'help' 查看可用命令</div>
    </div>
  </div>

  <!-- ===== LEVEL COMPLETE ===== -->
  <div id="level-complete">
    <h2 id="complete-title"></h2>
    <div class="stars" id="complete-stars"></div>
    <div class="score-text" id="complete-score"></div>
    <div class="knowledge-card" id="knowledge-card"></div>
    <button class="next-btn" id="next-btn" onclick="nextLevel()">▶ 下一任务</button>
  </div>

  <!-- ===== GAME COMPLETE ===== -->
  <div id="game-complete">
    <h2>🏆 任务全部完成！</h2>
    <div class="rank" id="final-rank"></div>
    <div class="final-score" id="final-score"></div>
    <button class="restart-btn" onclick="restartGame()">↺ 重新开始</button>
  </div>

  <!-- ===== PARTICLES ===== -->

let audioCtx;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { audioCtx = null; }
  }
}

function beep(freq, duration, type='square', vol=0.08) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function sfxClick() { try { beep(800, 0.06); } catch(e) {} }
function sfxCollect() { try { beep(1200, 0.08); beep(1600, 0.06); } catch(e) {} }
function sfxSuccess() { try { beep(523,0.1); beep(659,0.1); beep(784,0.15); } catch(e) {} }
function sfxFail() { try { beep(150,0.2, 'sawtooth'); } catch(e) {} }
function sfxComplete() {

  // Items
  data.items.forEach(item => {
    const collected = state.levelClues[state.currentLevel]?.includes(item.id);
    const hasAction = (item.action || item.detail?.action) ? ' action-item' : '';
    html += `<div class="hotspot ${collected ? 'collected' : ''}${hasAction}"
      style="left:${item.x}px;top:${item.y}px;width:${item.w}px;height:${item.h}px;"

      <span class="icon">${item.icon}</span>
      <span class="label">${collected ? '✓ '+item.label : item.label}</span>
    </div>`;
  });

  html += '</div>';
  scene.innerHTML = html;
}

function clickItem(itemId) {
  initAudio();
  const data = sceneData[state.currentLevel];
  const item = data.items.find(i => i.id === itemId);
  if (!item) return;

  sfxClick();

  // Mark as collected
  if (!state.levelClues[state.currentLevel]) state.levelClues[state.currentLevel] = [];
  if (!state.levelClues[state.currentLevel].includes(itemId)) {
    state.levelClues[state.currentLevel].push(itemId);
    if (item.clue) {
      state.clues.push(item.clue);
      sfxCollect();
      updateNotebook();
    }
  }

  // If item has an action, trigger it. Some scene entries store the action
  // inside detail with the panel copy, so support both shapes.
  const action = item.action || item.detail?.action;
  if (action === 'login') {
    openLoginPanel();
  } else if (action === 'email') {
    openEmailPanel();
  } else if (action === 'terminal') {
    openTerminal();
  } else {
    showDetail(item.detail);
  }

  renderScene();
}

  document.getElementById('login-clue-display').textContent = '提示：密码格式为"名字+日期"，全小写';

  // Multiple focus attempts for reliability
  pwInput.focus();
  setTimeout(() => pwInput.focus(), 100);
  setTimeout(() => pwInput.focus(), 300);
}

function updateStrength() {
  const pw = document.getElementById('password-input').value;
  const bar = document.getElementById('strength-fill');
  const txt = document.getElementById('strength-text');
  const len = pw.length;

  if (len === 0) { bar.style.width='0%'; bar.style.background='#444'; txt.textContent=''; return; }

  let score = 0;
  if (len >= 6) score++;
  if (len >= 8) score++;
  if (len >= 12) score++;
  if (/[a-z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[^a-zA-Z0-9]/.test(pw)) score++;

  let pct = Math.min(100, Math.round(score / 7 * 100));
  if (len < 8) pct = Math.min(pct, 45);
  else if (len < 12) pct = Math.min(pct, 75);
  bar.style.width = pct + '%';

  let color, msg;
  if (len < 8) { color='#ff4444'; msg='⚠ 太短了，至少8位'; }
  else if (pct < 55) { color='#ff9944'; msg='还可以更强：增加大小写/数字/符号'; }
  else if (pct < 80) { color='#ffdd44'; msg='中等强度：长度还可以继续提升'; }
  else { color='#44ff44'; msg='强密码：长度和字符类型都不错'; }
  bar.style.background = color;
  txt.textContent = msg;
}

function classifyPassword(pw) {
  let types = 0;
  if (/[a-z]/.test(pw)) types++;
  if (/[A-Z]/.test(pw)) types++;
  if (/[0-9]/.test(pw)) types++;
  if (/[^a-zA-Z0-9]/.test(pw)) types++;

  if (pw.length < 8 || types <= 1) return 'weak';
  if (pw.length >= 8 && types >= 3) return 'strong';
  return 'medium';
}

function tryLogin() {
  initAudio();
  const pw = document.getElementById('password-input').value.trim();
  const correct = sceneData[1].correctPassword;
  const fb = document.getElementById('login-feedback');

  if (pw === correct) {
    state.loginAttempts = 0;
    fb.innerHTML = '<span style="color:#00ff41;">✅ 密码正确！系统已解锁！</span>';
    sfxSuccess();
    state.score = Math.min(100, state.score + 10);
    setTimeout(() => {
      var lo=document.getElementById('login-overlay');lo.classList.remove('show');lo.style.display='none';
      completeLevel();
    }, 1200);
  } else if (pw.toLowerCase() === correct.toLowerCase() && pw !== correct) {
    state.loginAttempts++;
    fb.innerHTML = loginFailureText('⚠ 大小写不对哦...再看一眼便利贴的提示？');
    sfxFail();
    adjustScore(-8);
  } else if (pw.includes('旺财') || pw.includes('1015')) {
    state.loginAttempts++;
    fb.innerHTML = loginFailureText('🤔 思路对了一半。再看看线索，想想完整格式？');
    sfxFail();
    adjustScore(-8);
  } else {
    state.loginAttempts++;
    fb.innerHTML = loginFailureText('❌ 密码错误。去房间里多找找线索吧！');
    sfxFail();
    adjustScore(-8);
  }
}

function loginFailureText(baseText) {
  const attemptsLeft = Math.max(0, 3 - state.loginAttempts);
  if (state.loginAttempts >= 3) {
    return `<span style="color:#ffd93d;">${baseText}</span><br>
      <span style="color:#ff6b6b;">密码尝试失败，安全指数 -8。</span><br>
      <span style="color:#00d4ff;">系统遗留提示已暴露：密码是旺财名字的全小写拼音+旺财的生日日期</b>。输入它即可解锁。</span>`;
  }
  return `<span style="color:#ffd93d;">${baseText}</span><br>
    <span style="color:#ff6b6b;">密码尝试失败，安全指数 -8。</span><br>
    <span style="color:#777;">再错 ${attemptsLeft} 次，将自动解锁完整提示。</span>`;
}

function openTerminal() {
  const term = document.getElementById('terminal-panel');
  const output = document.getElementById('term-output');
  const hintArea = document.getElementById('term-hint-area');

  // Build terminal output
  let out = '<div style="color:#777;">服务器管理终端 v2.1 — 输入 help 查看命令</div>';
  out += '<div style="color:#777;">──────────────────────────────────</div>';

  state.terminalState.commands.forEach(cmd => {
    out += `<div><span style="color:#00d4ff;">server-admin@firewall:~$</span> <span style="color:#fff;">${cmd.cmd}</span></div>`;
    out += `<div style="color:#aaa;">${cmd.output}</div>`;
  });

  // Update hint
  const ts = state.terminalState;
  if (ts.firewallEnabled && ts.passwordChanged && ts.portsClosed.length >= 2) {
    hintArea.innerHTML = '<span style="color:#00ff41;">✅ 所有安全措施已就绪！关闭终端即可完成任务。</span>';
  } else if (ts.portsClosed.length >= 2 && ts.passwordChanged) {
    hintArea.innerHTML = '💡 还有一步：输入 <b>firewall enable</b> 启用防火墙';
  } else if (ts.portsClosed.length >= 2) {
    hintArea.innerHTML = '💡 下一步：修改默认密码。输入 <b>passwd admin</b>';
  } else if (ts.portsClosed.length >= 1) {
    hintArea.innerHTML = '💡 还有不安全的端口。试试 <b>close 23</b> 或 <b>close 21</b>';
  } else {
    hintArea.innerHTML = '💡 输入 <b>help</b> 查看可用命令。先检查端口状态：<b>status</b>';
  }

  out += `<div class="term-input-line"><span class="term-prompt">server-admin@firewall:~$</span>
    <input class="term-input" id="term-input" onkeydown="handleTerminalKey(event)" autofocus></div>`;

  output.innerHTML = out;
  const tOverlay = document.getElementById('terminal-overlay');
  tOverlay.classList.add('show');
  tOverlay.style.display = 'flex';

  setTimeout(() => {
    const inp = document.getElementById('term-input');
    if (inp) inp.focus();
  }, 200);
}

function checkTerminalCompletion() {
  const ts = state.terminalState;
  if (levelCompleting) return true;
  if (ts.portsClosed.includes(23) && ts.portsClosed.includes(21) &&
      ts.passwordChanged && ts.firewallEnabled) {
    setTimeout(() => {
      var to=document.getElementById('terminal-overlay');to.classList.remove('show');to.style.display='none';
      completeLevel();
    }, 2000);
    return true;
  }
  return false;
}

function handleTerminalKey(e) {
  if (e.key !== 'Enter') return;
  const input = document.getElementById('term-input');
  const cmd = input.value.trim().toLowerCase();
  if (!cmd) return;

  initAudio();
  let output = '';
  const ts = state.terminalState;

  switch (cmd) {
    case 'help':
      output = `<span style="color:#ffd93d;">可用命令：</span><br>
        status &nbsp;— 查看当前安全状态<br>
        scan &nbsp;&nbsp;— 扫描开放端口<br>
        close &lt;端口号&gt; — 关闭指定端口<br>
        passwd &lt;用户名&gt; — 修改用户密码<br>
        firewall enable — 启用防火墙<br>
        clear — 清屏<br>
        exit — 退出终端`;
      break;

    case 'status':
    case 'scan':
      const ports = [];
      if (!ts.portsClosed.includes(23)) ports.push('<span style="color:#ff6b6b;">23 (Telnet) ⚠ 不安全</span>');
      if (!ts.portsClosed.includes(21)) ports.push('<span style="color:#ff6b6b;">21 (FTP) ⚠ 不安全</span>');
      ports.push('<span style="color:#00ff41;">22 (SSH) ✓</span>');
      ports.push('<span style="color:#00ff41;">80 (HTTP) ✓</span>');
      ports.push('<span style="color:#00ff41;">443 (HTTPS) ✓</span>');
      output = `开放端口扫描：<br>${ports.join('<br>')}<br><br>
        默认账户：admin / <span style="color:#ff6b6b;">admin</span> ⚠ 弱密码<br>
        防火墙状态：${ts.firewallEnabled ? '<span style="color:#00ff41;">已启用</span>' : '<span style="color:#ff6b6b;">未启用 ⚠</span>'}`;
      break;

    case 'close 23':
      if (ts.portsClosed.includes(23)) {
        adjustScore(-2);
        output = '<span style="color:#ffd93d;">端口 23 已经关闭了。重复操作造成审计噪声，安全指数 -2。</span>';
        sfxFail();
      } else {
        ts.portsClosed.push(23);
        output = '<span style="color:#00ff41;">✅ 已关闭端口 23 (Telnet)。Telnet 使用明文传输，极易被窃听。</span>';
        state.score = Math.min(100, state.score + 5);
        state.clues.push('已关闭 Telnet (端口23) — 明文协议不安全');
        sfxSuccess();
      }
      break;

    case 'close 21':
      if (ts.portsClosed.includes(21)) {
        adjustScore(-2);
        output = '<span style="color:#ffd93d;">端口 21 已经关闭了。重复操作造成审计噪声，安全指数 -2。</span>';
        sfxFail();
      } else {
        ts.portsClosed.push(21);
        output = '<span style="color:#00ff41;">✅ 已关闭端口 21 (FTP)。FTP 同样使用明文传输，建议用 SFTP。</span>';
        state.score = Math.min(100, state.score + 5);
        state.clues.push('已关闭 FTP (端口21) — 改用安全的 SFTP');
        sfxSuccess();
      }
      break;

    case 'passwd admin':
      output = `<span style="color:#ffd93d;">新密码：</span><input id="new-passwd" type="text"
        style="background:#000;border:1px solid #333;color:var(--neon);font-family:var(--font-terminal);padding:4px;"
        onkeydown="if(event.key==='Enter')confirmPasswd()">
        <button onclick="confirmPasswd()" style="cursor:pointer;background:transparent;color:var(--neon);border:1px solid var(--neon);font-family:var(--font-pixel);font-size:12px;">确认修改</button>`;
      break;

    case 'firewall enable':
      if (ts.firewallEnabled) {
        adjustScore(-2);
        output = '<span style="color:#ffd93d;">防火墙已经在运行中。重复变更配置，安全指数 -2。</span>';
        sfxFail();
      } else {
        ts.firewallEnabled = true;
        output = '<span style="color:#00ff41;">✅ 防火墙已启用。默认规则：拒绝所有入站连接，仅允许必要服务。</span>';
        state.score = Math.min(100, state.score + 5);
        state.clues.push('已启用防火墙 — 默认拒绝入站连接');
        sfxSuccess();
      }
      break;

    case 'clear':
      state.terminalState.commands = [];
      openTerminal();
      return;

    case 'exit':
      document.getElementById('terminal-overlay').classList.remove('show');
      document.getElementById('terminal-overlay').style.display = 'none';
      return;

    default:
      if (cmd.startsWith('close ')) {
        adjustScore(-5);
        output = `<span style="color:#ffd93d;">端口操作错误: ${cmd}。只能关闭确认不安全的 23(Telnet) 和 21(FTP)，安全指数 -5。</span>`;
      } else {
        adjustScore(-3);
        output = `<span style="color:#ffd93d;">未知命令: ${cmd}。误操作会留下风险窗口，安全指数 -3。输入 help 查看可用命令。</span>`;
      }
      sfxFail();
  }

  if (output) {
    ts.commands.push({ cmd, output });
    document.getElementById('bar-score').textContent = '🔒 安全指数: ' + state.score;
    updateNotebook();
    renderScene();

    checkTerminalCompletion();
  }

  openTerminal(); // refresh terminal display
}

function confirmPasswd() {
  initAudio();
  const newPw = document.getElementById('new-passwd')?.value.trim();
  if (!newPw) return;
  if (newPw === 'admin') {
    adjustScore(-20);
    alert('不能继续使用默认密码！弱密码操作扣除 20 分，请设置一个新密码。');
    sfxFail();
    return;
  }
  state.terminalState.passwordChanged = true;
  const strength = classifyPassword(newPw);
  let penaltyText = '';
  if (strength === 'weak') {
    adjustScore(-20);
    penaltyText = '<br><span style="color:#ff6b6b;">⚠ 新密码强度过弱，安全指数 -20。建议至少8位并混合多类字符。</span>';
    sfxFail();
  } else if (strength === 'medium') {
    adjustScore(-10);
    penaltyText = '<br><span style="color:#ffd93d;">⚠ 新密码强度中等，安全指数 -10。建议至少8位，并在小写/大写/数字/符号中满足任意3类。</span>';
    sfxFail();
  } else {
    adjustScore(5);
    penaltyText = '<br><span style="color:#00ff41;">✅ 新密码强度良好，安全指数 +5。</span>';
    sfxSuccess();
  }

  // Replace the pending passwd command entry with the completion message
  const cmds = state.terminalState.commands;
  for (let i = cmds.length - 1; i >= 0; i--) {
    if (cmds[i].cmd === 'passwd admin') {
      cmds[i].output = '<span style="color:#00ff41;">✅ 密码已修改。旧密码 \'admin\' → 新密码已设置。默认密码是重大安全隐患！</span>' + penaltyText;
      break;
    }
  }
  state.clues.push('已修改默认密码 — 不使用弱密码和默认密码');
  updateNotebook();
  renderScene();
  checkTerminalCompletion();
  openTerminal();
}

// ============================================================
function spawnParticles(count = 30) {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width = 1000; canvas.height = 700;
  canvas.style.display = 'block';

  const particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * 1000, y: Math.random() * 700,
      vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4 - 2,
      life: 1, color: ['#00ff41','#ffd93d','#00d4ff','#ff6b6b'][Math.floor(Math.random()*4)],
      size: Math.random() * 4 + 2,
    });
  }

  function animate() {
    ctx.clearRect(0, 0, 1000, 700);
    let alive = false;
    particles.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.05; // gravity
      p.life -= 0.01;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;
    if (alive) requestAnimationFrame(animate);
    else canvas.style.display = 'none';
  }
  animate();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.popup-overlay.show, .panel-overlay.show').forEach(el => { el.classList.remove('show'); el.style.display = 'none'; });
  }
});
</script>
</body>
</html>
